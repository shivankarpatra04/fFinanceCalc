kind = "web"
previewPath = "/"
title = "FinanceCalc.in"
version = "1.0.0"
id = "artifacts/financecalc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25648

[services.development]
run = "pnpm --filter @workspace/financecalc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/financecalc", "run", "build" ]
publicDir = "artifacts/financecalc/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25648"
BASE_PATH = "/"
